[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-quali-gaps"
version = "0.1.0"
description = "Pipeline de análise de gaps de qualifying da Formula 1"
requires-python = ">=3.12"
dependencies = [
    "fastf1>=3.4",
    "duckdb>=1.0",
    "pyarrow>=16",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    # Usado por analysis/. A FastF1 ja o arrasta como dependencia transitiva,
    # mas depender disso e depender de um acidente -- declarado aqui de proposito.
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[tool.setuptools]
packages = ["ingest"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: erros e pyflakes. I: ordena imports. UP: sintaxe moderna. B: bugs comuns.
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
