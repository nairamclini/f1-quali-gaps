name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Testes Python
        run: pytest tests/ -v

      # O Parquet nao e versionado (e dado, nao codigo), entao o CI precisa
      # extrair antes de transformar. Consequencia assumida: o CI depende da
      # API publica da FastF1 estar de pe. Se isso virar fonte de falha
      # intermitente, a saida e cachear o diretorio cache/ entre execucoes.
      - name: Ingestao
        run: python -m ingest.extract --season 2025 --round 1

      # working-directory e obrigatorio: o caminho do DuckDB no profiles.yml
      # e relativo ao diretorio de trabalho, nao ao --project-dir.
      - name: dbt build
        working-directory: f1_dbt
        run: dbt build
